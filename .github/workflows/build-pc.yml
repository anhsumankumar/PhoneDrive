name: Build Windows PC Standalone EXE & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js for Web Dashboard
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Dashboard
        run: |
          cd web-dashboard
          npm install
          npm run build

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 10 -r pc/requirements.txt
          pip install --retries 10 pyinstaller pillow

      - name: Build Standalone Windows One-File EXE
        run: |
          python pc/build_exe.py --onefile

      - name: Upload EXE as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneDrive-PC-v1.0.0-EXE
          path: release-assets/PhoneDrive-PC-v1.0.0.exe

      - name: Update GitHub Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[*] Uploading standalone Windows EXE to GitHub Release v1.0.0..."
          gh release upload v1.0.0 release-assets/PhoneDrive-PC-v1.0.0.exe --clobber || {
            echo "[!] Could not update release asset directly, will retry..."
          }
