name: Build macOS DMG & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js for Web Dashboard
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Dashboard
        run: |
          cd web-dashboard
          npm install
          npm run build

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip || true
          pip install --retries 10 -r pc/requirements.txt
          pip install --retries 10 pyinstaller pillow

      - name: Build Native Mach-O PhoneDrive.app & Apple DMG
        run: |
          python pc/build_mac.py

      - name: Upload DMG as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneDrive-macOS-v1.0.0-DMG
          path: release-assets/PhoneDrive-macOS-v1.0.0.dmg

      - name: Update GitHub Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[*] Uploading native compiled macOS DMG to GitHub Release v1.0.0..."
          gh release upload v1.0.0 release-assets/PhoneDrive-macOS-v1.0.0.dmg --clobber || {
            echo "[!] Could not update release via gh CLI directly, checking fallback..."
          }
