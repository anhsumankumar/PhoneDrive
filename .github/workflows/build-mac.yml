name: Build macOS DMG & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js for Web Dashboard
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Dashboard
        run: |
          cd web-dashboard
          npm install
          npm run build

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pc/requirements.txt
          pip install pyinstaller pillow pycdlib

      - name: Build macOS Application Bundle & DMG
        run: |
          python pc/build_mac.py

      - name: Upload DMG as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneDrive-macOS-DMG
          path: release-assets/PhoneDrive-macOS-v1.0.0.dmg

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/PhoneDrive-macOS-v1.0.0.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
